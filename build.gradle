plugins { id 'java' }
repositories { mavenCentral(); maven { url = 'https://repo.runelite.net' } }
def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
}
group = 'com.runechronicle'
version = '0.8.0'
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release.set(11) }
def pluginMainClass='com.runechronicle.RuneChroniclePluginTest'
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
tasks.named('test') {
    failOnNoDiscoveredTests = false
}